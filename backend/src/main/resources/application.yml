spring:
  application:
    name: no-code-agent-backend
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}

app:
  storage:
    agents-dir: ./data/agents
    schedules-file: ./data/schedules/schedules.json
  cors:
    allowed-origins: http://localhost:5173
