services:
  backend:
    image: maven:3.9.9-eclipse-temurin-23
    working_dir: /app
    command: mvn spring-boot:run
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-demo-key}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - backend-m2:/root/.m2
      - backend-data:/app/data

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  backend-m2:
  backend-data:
  frontend-node-modules:
